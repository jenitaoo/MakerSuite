name: CI/CD Pipeline

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --prefix ./ui
      - run: npm run test:ci --prefix ./ui || true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install -r backend/requirements.txt
      - run: pytest backend/ --cov=backend || true

  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend (Vercel staging)
        working-directory: ./ui
        run: |
          npm install -g vercel
          npm install
          npm run build
          vercel deploy --prod --yes --token $VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy backend staging (Railway)
        run: npx @railway/cli up --service staging --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  approval:
    if: github.ref == 'refs/heads/staging'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - run: echo "Awaiting manual approval..."

  create-pr:
    if: github.ref == 'refs/heads/staging'
    needs: approval
    runs-on: ubuntu-latest

    steps:
      - name: Create PR staging → main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: staging
          title: "Release: staging → main"

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend (Vercel production)
        working-directory: ./ui
        run: |
          npm install -g vercel
          npm install
          npm run build
          vercel deploy --prod --yes --token $VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy backend (Railway)
        run: npx @railway/cli up --service production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}