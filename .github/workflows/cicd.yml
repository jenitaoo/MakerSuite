name: CI/CD Pipeline

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --prefix ./ui
      - run: npm run test:ci --prefix ./ui || true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install -r backend/requirements.txt
      - run: pytest backend/ --cov=backend || true

  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend (Vercel staging)
        working-directory: ./ui
        run: |
          npm install -g vercel
          npm install
          npm run build
          vercel deploy --prod --yes --token $VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy backend staging (Railway)
        run: npx @railway/cli up --service makersuite-staging --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend (Vercel production)
        working-directory: ./ui
        run: |
          npm install -g vercel
          npm install
          npm run build
          vercel deploy --prod --yes --token $VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy backend production (Railway)
        run: npx @railway/cli up --service makersuite-production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}